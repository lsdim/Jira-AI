<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Налаштування Jira AI Helper</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 300px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #0052cc; color: white; border: none; border-radius: 3px; cursor: pointer; }
    button:hover { background: #0065ff; }
    .status { margin-top: 10px; font-size: 0.9em; color: green; }
  </style>
</head>
<body>
  <h2>Налаштування</h2>
  <div class="field">
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Вставте ключ тут...">
  </div>
  <button id="save">Зберегти</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
